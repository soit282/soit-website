name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Add 404 fallback for SPA routing
        run: cp dist/index.html dist/404.html

      - name: Create static HTML for SPA routes (fixes GitHub Pages 404 on direct access)
        run: |
          routes=("about" "services" "works" "contact" "playground" "works/tbros" "works/dogma" "works/tramade" "works/unavailable")
          for route in "${routes[@]}"; do
            mkdir -p "dist/${route}"
            cp dist/index.html "dist/${route}/index.html"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
